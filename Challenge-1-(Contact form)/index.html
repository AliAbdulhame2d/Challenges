<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
     <div class="wrapper">
        <h1>Contact Us</h1>
        <form action="" class="contact">
            <!--First Name and Last Name-->
            <div class="form-row">
                <div class="form-group ">
                    <label for="fname">First Name *</label>
                    <input type="text" id="fname" required>
                </div>

                
                <div class="form-group">
                    <label for="lname">Last Name *</label>
                    <input type="text" id="lname" required>
                </div>

            </div>
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" required>
            </div>

            
                <div class="form-group ">
                    <label for="query_type">Query Type </label>
                    <div class="form-row">
                        <div class="radio"><input type="radio" id="query_type" name="query_type" value="1" checked required> <p>General Enquiry</p></div>
                        <div class="radio"><input type="radio" name="query_type" value="2" required><p> Support Request </p></div>
                    </div>
                </div>

            <div class="form-group">
                <label for="message">Message *</label>
                <textarea id="message" name="message" rows="3" cols="50"></textarea>
            </div>
            
            <div class="form-row check">
                <input type="checkbox" required>
                <div>I consent to being contacted by the team *</div>
            </div>
            <button type="submit">Submit</button>

        </form>
     </div>
    </div>
<script src="main.js"></script>
</body>
</html>
